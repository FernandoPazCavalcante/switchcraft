# ============================================================
# setup.conf — edit this file ONCE with your data.
# Everything else in the repository is generated from here.
# ============================================================

# Root directory where projects live
PROJECTS_ROOT="$HOME/projects"

# ---------------- Account A ----------------
A_SLUG="account-a"                      # folder name: ~/projects/account-a
A_GIT_NAME="Your Name A"
A_GIT_EMAIL="account-a-email@example.com"
A_GITHUB_USER="github-user-a"           # only for verification messages

# ---------------- Account B ----------------
B_SLUG="account-b"
B_GIT_NAME="Your Name B"
B_GIT_EMAIL="account-b-email@example.com"
B_GITHUB_USER="github-user-b"
